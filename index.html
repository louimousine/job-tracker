<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Application tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Narrow:wght@500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --paper: #E7E8E2;
    --card: #F3F4EF;
    --ink: #171A17;
    --muted: #64695F;
    --rule: #C8CBC0;
    --rule-soft: #D9DBD2;
    --fresh: #2E6B4F;
    --aging: #96680F;
    --stale: #94302A;
    --accent: #24405C;
    --font: "Archivo", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-narrow: "Archivo Narrow", "Archivo", ui-sans-serif, system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    background: var(--paper); color: var(--ink);
    font-family: var(--font); font-size: 15px; line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 1060px; margin: 0 auto; padding: 28px 20px 64px; }

  .masthead {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 16px; flex-wrap: wrap;
    padding-bottom: 14px; border-bottom: 2px solid var(--ink);
  }
  .masthead h1 { font-size: 21px; font-weight: 600; letter-spacing: -0.015em; margin: 0; }

  .tally {
    font-family: var(--font-narrow); font-size: 14px;
    color: var(--muted); font-variant-numeric: tabular-nums;
  }
  .tally b { color: var(--ink); font-weight: 600; }
  .tally .warn { color: var(--stale); }

  .sync-dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    margin-right: 5px; background: var(--muted);
  }
  .sync-dot.ok { background: var(--fresh); }
  .sync-dot.bad { background: var(--stale); }

  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 14px 0; }

  button { font-family: var(--font); font-size: 14px; cursor: pointer; border-radius: 3px; }

  .btn-primary {
    background: var(--accent); color: #F3F4EF; border: 1px solid var(--accent);
    padding: 7px 14px; font-weight: 500;
  }
  .btn-primary:hover { background: #1B3049; }

  .btn-quiet {
    background: transparent; color: var(--muted);
    border: 1px solid var(--rule); padding: 6px 11px;
  }
  .btn-quiet:hover { color: var(--ink); border-color: var(--muted); }

  button[disabled] { opacity: 0.55; cursor: progress; }

  .search {
    flex: 1 1 200px; min-width: 160px;
    font-family: var(--font); font-size: 14px; padding: 7px 10px;
    background: var(--card); border: 1px solid var(--rule);
    border-radius: 3px; color: var(--ink);
  }
  .search::placeholder { color: var(--muted); }

  .filters { display: flex; gap: 4px; flex-wrap: wrap; }

  .chip {
    font-family: var(--font-narrow); font-size: 13.5px;
    background: transparent; border: 1px solid transparent;
    color: var(--muted); padding: 5px 9px;
  }
  .chip:hover { color: var(--ink); }
  .chip[aria-pressed="true"] {
    color: var(--ink); border-color: var(--rule);
    background: var(--card); font-weight: 600;
  }

  .viewonly {
    background: var(--card); border: 1px solid var(--rule);
    border-left: 3px solid var(--accent); border-radius: 2px;
    padding: 10px 14px; margin-bottom: 14px; font-size: 13.5px; color: var(--muted);
    display: flex; justify-content: space-between; align-items: center;
    gap: 12px; flex-wrap: wrap;
  }

  .heads {
    display: grid; grid-template-columns: 52px 1fr 132px 116px; gap: 12px;
    padding: 0 12px 6px 14px; border-bottom: 1px solid var(--rule);
    font-family: var(--font-narrow); font-size: 12.5px; color: var(--muted);
  }
  .heads span:first-child { text-align: right; }

  .rows { border-bottom: 1px solid var(--rule); }

  .row { border-bottom: 1px solid var(--rule-soft); border-left: 3px solid transparent; }
  .row:last-child { border-bottom: none; }
  .row.age-fresh { border-left-color: var(--fresh); }
  .row.age-aging { border-left-color: var(--aging); }
  .row.age-stale { border-left-color: var(--stale); }

  .row-main {
    display: grid; grid-template-columns: 52px 1fr 132px 116px; gap: 12px;
    align-items: center; width: 100%; text-align: left;
    background: transparent; border: none; padding: 11px;
    font-family: var(--font); color: var(--ink);
  }
  .row-main:hover { background: var(--card); }
  .row-main > * { min-width: 0; }

  .age {
    text-align: right; font-variant-numeric: tabular-nums;
    font-size: 15px; font-weight: 600; color: var(--muted);
  }
  .age.fresh { color: var(--fresh); }
  .age.aging { color: var(--aging); }
  .age.stale { color: var(--stale); }

  .who { min-width: 0; }

  .company {
    font-weight: 600; font-size: 15px; letter-spacing: -0.01em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .role {
    font-size: 13.5px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .source {
    font-family: var(--font-narrow); font-size: 13.5px; color: var(--muted);
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .tag {
    font-family: var(--font-narrow); font-size: 13px; font-weight: 600;
    padding: 3px 8px; border-radius: 2px; border: 1px solid;
    display: inline-block; white-space: nowrap;
  }
  .tag.saved     { color: var(--muted); border-color: var(--rule); }
  .tag.applied   { color: var(--accent); border-color: #A9B6C4; background: #DFE5EB; }
  .tag.screening { color: var(--accent); border-color: var(--accent); background: #DFE5EB; }
  .tag.interview { color: var(--fresh); border-color: var(--fresh); background: #DDE9E2; }
  .tag.offer     { color: #F3F4EF; border-color: var(--fresh); background: var(--fresh); }
  .tag.rejected  { color: var(--muted); border-color: var(--rule); background: #DFDFD9; }

  .row.is-rejected .company, .row.is-rejected .role { color: var(--muted); }
  .row.is-rejected .company { font-weight: 500; }

  .detail { padding: 4px 14px 20px 14px; background: var(--card); border-top: 1px solid var(--rule-soft); }

  .meta {
    display: flex; gap: 22px; flex-wrap: wrap;
    font-size: 13.5px; color: var(--muted); padding: 12px 0;
    min-width: 0; overflow-wrap: anywhere;
  }
  .meta > span { max-width: 100%; }
  .meta b { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }
  .meta a { color: var(--accent); }

  .jd {
    background: var(--paper); border: 1px solid var(--rule); border-radius: 2px;
    padding: 13px 15px; max-height: 300px; overflow-y: auto;
    white-space: pre-wrap; font-size: 13.5px; line-height: 1.6;
    max-width: 74ch; overflow-wrap: anywhere;
  }
  .jd-empty { font-size: 13.5px; color: var(--muted); padding: 6px 0; }

  .notes {
    font-size: 13.5px; padding: 10px 0 0; max-width: 74ch;
    white-space: pre-wrap; overflow-wrap: anywhere;
  }

  .detail-actions { display: flex; gap: 8px; padding-top: 14px; flex-wrap: wrap; }

  .btn-danger { color: var(--stale); border-color: #D5B6B3; }
  .btn-danger:hover { color: var(--stale); border-color: var(--stale); }

  .form {
    background: var(--card); border: 1px solid var(--rule); border-radius: 3px;
    padding: 18px; margin-bottom: 18px;
  }
  .form h2 { font-size: 16px; font-weight: 600; margin: 0 0 14px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }

  .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .field.wide { grid-column: 1 / -1; }

  label { font-family: var(--font-narrow); font-size: 13px; color: var(--muted); }

  input, select, textarea {
    font-family: var(--font); font-size: 14px; padding: 7px 9px;
    background: var(--paper); border: 1px solid var(--rule);
    border-radius: 2px; color: var(--ink); width: 100%;
  }
  textarea { resize: vertical; line-height: 1.55; min-height: 120px; }
  .paste-jd { min-height: 210px; }

  .form-actions { display: flex; gap: 8px; padding-top: 15px; align-items: center; flex-wrap: wrap; }

  .hint { font-size: 13px; color: var(--muted); }
  .hint.bad { color: var(--stale); }
  .hint.good { color: var(--fresh); }

  .prefill-note { font-size: 13px; color: var(--fresh); padding-bottom: 12px; margin-top: -6px; }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .empty { padding: 48px 16px; text-align: center; color: var(--muted); font-size: 14.5px; }
  .empty b { color: var(--ink); font-weight: 600; display: block; margin-bottom: 5px; font-size: 15px; }

  .footer {
    display: flex; justify-content: space-between; align-items: center;
    gap: 12px; flex-wrap: wrap; padding-top: 16px; font-size: 13px; color: var(--muted);
  }
  .footer-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-family: var(--font-narrow); font-size: 13px; color: var(--muted); }
  .legend i { display: inline-block; width: 3px; height: 12px; margin-right: 6px; vertical-align: -1px; }

  .toast {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    background: var(--ink); color: var(--paper);
    padding: 9px 16px; border-radius: 3px; font-size: 13.5px;
    opacity: 0; pointer-events: none; transition: opacity 140ms ease; z-index: 20;
  }
  .toast.show { opacity: 1; }

  [hidden] { display: none !important; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  @media (max-width: 620px) {
    .heads { display: none; }
    .row-main {
      grid-template-columns: 44px 1fr;
      grid-template-areas: "age who" ". tags";
      row-gap: 7px;
    }
    .row-main .age { grid-area: age; }
    .row-main .who { grid-area: who; }
    .row-main .source { display: none; }
    .row-main .status-cell { grid-area: tags; }
  }
</style>

<div class="wrap">

  <div class="masthead">
    <h1>Application tracker</h1>
    <div class="tally" id="tally"></div>
  </div>

  <div class="toolbar" id="toolbar"></div>

  <div id="banner"></div>
  <div id="formHost"></div>

  <div class="heads" id="heads">
    <span>Days</span>
    <span>Company and role</span>
    <span>Found on</span>
    <span>Status</span>
  </div>

  <div class="rows" id="rows"></div>

  <div class="footer">
    <div class="legend">
      <span><i style="background:var(--fresh)"></i>Under 10 days</span>
      <span><i style="background:var(--aging)"></i>10 to 20 days</span>
      <span><i style="background:var(--stale)"></i>21 days or more</span>
    </div>
    <div class="footer-actions" id="footerActions"></div>
  </div>

</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  /* =========================================================
     Settings. The only lines you would ever edit.
     ========================================================= */

  var SYNC_URL = "https://script.google.com/macros/s/AKfycbxl8Ervrcaenrz1Fa7oBIIWZ7igQSd_khuzUS43tGUamzL_walRYp2saLssOO3XMZ9B/exec";

  // Read-only. Safe to have here in a public repo: it can look, never change.
  var READ_TOKEN = "rd-5fb5ab7045";

  /* ========================================================= */

  var LKEY = "tracker:applications";
  var WKEY = "tracker:write";        // the write password, typed per device
  var AKEY = "tracker:apikey";       // Gemini key, typed per device
  var MKEY = "tracker:geminimodel";

  // Tried in order. Google retires models fairly often, so whichever answers
  // first is remembered and used from then on.
  var GEMINI_MODELS = [
    "gemini-3.6-flash",
    "gemini-3.7-flash",
    "gemini-3.1-flash-lite",
    "gemini-2.5-flash"
  ];

  var STATUSES = ["Saved", "Applied", "Screening", "Interview", "Offer", "Rejected"];
  var ROUTES = ["Cold application", "Referral", "Recruiter reached out", "Campus"];
  var SOURCES = ["LinkedIn", "Careers page", "Naukri", "Instahyre", "From a person", "Campus portal", "Newsletter", "Other"];
  var LEGACY_SOURCE = {
    "ATS": "Careers page",
    "Company site": "Careers page",
    "Email": "From a person",
    "Referral": "From a person"
  };
  var AGEING = ["Applied", "Screening"];

  var items = [];
  var syncState = "off";
  var dirty = false;
  var filter = "All";
  var query = "";
  var openId = null;
  var editing = null;
  var pasting = false;
  var importing = false;
  var unlocking = false;
  var draftSeed = null;
  var prefilled = false;

  var $rows = document.getElementById("rows");
  var $tally = document.getElementById("tally");
  var $toolbar = document.getElementById("toolbar");
  var $banner = document.getElementById("banner");
  var $formHost = document.getElementById("formHost");
  var $heads = document.getElementById("heads");
  var $toast = document.getElementById("toast");
  var $footer = document.getElementById("footerActions");

  /* ---------- helpers ---------- */

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function local(k, v) {
    try {
      if (v === undefined) return localStorage.getItem(k);
      localStorage.setItem(k, v);
      return v;
    } catch (e) { return null; }
  }

  function writeToken() { return local(WKEY) || ""; }
  function canWrite() { return !!writeToken(); }
  function apiKey() { return local(AKEY) || ""; }
  function activeToken() { return writeToken() || READ_TOKEN; }

  function today() {
    var d = new Date();
    return new Date(d.getFullYear(), d.getMonth(), d.getDate());
  }

  function isoToday() {
    var d = today();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  function daysSince(iso) {
    if (!iso) return null;
    var p = String(iso).split("-");
    if (p.length !== 3) return null;
    var then = new Date(+p[0], +p[1] - 1, +p[2]);
    if (isNaN(then)) return null;
    return Math.max(0, Math.round((today() - then) / 86400000));
  }

  function bucket(n) {
    if (n == null) return "";
    if (n >= 21) return "stale";
    if (n >= 10) return "aging";
    return "fresh";
  }

  function host(url) {
    var m = String(url || "").match(/^https?:\/\/(?:www\.)?([^\/?#]+)/i);
    return m ? m[1] : "";
  }

  function toast(msg) {
    $toast.textContent = msg;
    $toast.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { $toast.classList.remove("show"); }, 2100);
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  /** Older entries put the posting URL in the source field. Move it where it belongs. */
  function tidy(list) {
    var changed = false;
    list.forEach(function (it) {
      var s = String(it.source || "").trim();
      if (/^https?:\/\//i.test(s)) {
        if (!it.url) it.url = s;
        it.source = "";
        s = "";
        changed = true;
      }
      if (s && LEGACY_SOURCE[s]) { it.source = LEGACY_SOURCE[s]; changed = true; }
      else if (s && SOURCES.indexOf(s) === -1) { it.source = "Other"; changed = true; }
    });
    return changed;
  }

  /** Tolerant of raw line breaks and separator characters pasted in from job boards. */
  function safeParse(raw) {
    try { return JSON.parse(raw); } catch (e) {}

    var out = "", inStr = false, esc2 = false;
    for (var i = 0; i < raw.length; i++) {
      var ch = raw[i], code = raw.charCodeAt(i);
      if (esc2) { out += ch; esc2 = false; continue; }
      if (inStr && ch === "\\") { out += ch; esc2 = true; continue; }
      if (ch === '"') { inStr = !inStr; out += ch; continue; }
      if (inStr && (code < 0x20 || code === 0x2028 || code === 0x2029)) {
        if (ch === "\n") out += "\\n";
        else if (ch === "\r") out += "\\r";
        else if (ch === "\t") out += "\\t";
        else out += "\\u" + ("000" + code.toString(16)).slice(-4);
        continue;
      }
      out += ch;
    }
    try { return JSON.parse(out); } catch (e2) { return null; }
  }

  /* ---------- storage and sync ---------- */

  function pullRemote(quiet) {
    if (!SYNC_URL) { syncState = "off"; render(); return Promise.resolve(); }

    return fetch(SYNC_URL + "?token=" + encodeURIComponent(activeToken()) + "&t=" + Date.now())
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.error) throw new Error(data.error);
        var next = Array.isArray(data.entries) ? data.entries : [];

        // An empty sheet must never silently replace entries held locally. That is
        // almost always a token or deployment problem, not a real deletion.
        if (!next.length && items.length) {
          syncState = "bad";
          renderTally();
          toast("The sheet came back empty. Keeping the " + items.length + " entries on this device.");
          return;
        }

        var fixed = tidy(next);
        var before = JSON.stringify(items);

        items = next;
        local(LKEY, JSON.stringify(items));
        syncState = "ok";
        dirty = false;

        if (JSON.stringify(items) !== before) {
          render();
          if (quiet) toast("Updated from the sheet.");
        } else {
          renderTally();
        }
        if (fixed && canWrite()) save();
      })
      .catch(function () {
        syncState = "bad";
        renderTally();
        if (!quiet) toast("Could not reach the sheet. Showing the last local copy.");
      });
  }

  function load() {
    $rows.innerHTML = '<div class="empty">Loading.</div>';
    try { items = JSON.parse(local(LKEY) || "[]"); } catch (e) { items = []; }
    if (!Array.isArray(items)) items = [];
    tidy(items);
    render();
    pullRemote(false);
  }

  function save() {
    local(LKEY, JSON.stringify(items));

    if (!canWrite()) return Promise.resolve();
    if (!SYNC_URL) { syncState = "off"; return Promise.resolve(); }

    return fetch(SYNC_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ token: writeToken(), entries: items })
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.error) throw new Error(data.error);
        syncState = "ok";
        dirty = false;
        renderTally();
      })
      .catch(function () {
        syncState = "bad";
        dirty = true;
        renderTally();
        toast("Saved here. The sheet did not update, will retry.");
      });
  }

  /* ---------- derived ---------- */

  function visible() {
    var q = query.trim().toLowerCase();
    return items.filter(function (it) {
      if (filter !== "All" && it.status !== filter) return false;
      if (!q) return true;
      return [it.company, it.role, it.location, it.source, it.resume, it.referrer, it.route, it.notes, it.jd]
        .join(" ").toLowerCase().indexOf(q) > -1;
    }).sort(function (a, b) {
      var ra = a.status === "Rejected" ? 1 : 0;
      var rb = b.status === "Rejected" ? 1 : 0;
      if (ra !== rb) return ra - rb;
      var da = AGEING.indexOf(a.status) > -1 ? (daysSince(a.appliedDate) || 0) : -1;
      var db = AGEING.indexOf(b.status) > -1 ? (daysSince(b.appliedDate) || 0) : -1;
      if (da !== db) return db - da;
      return (Number(b.createdAt) || 0) - (Number(a.createdAt) || 0);
    });
  }

  function resumeNames() {
    var seen = {};
    items.forEach(function (it) { if (it.resume) seen[it.resume] = true; });
    return Object.keys(seen).sort();
  }

  /* ---------- render ---------- */

  function renderTally() {
    var waiting = items.filter(function (it) { return AGEING.indexOf(it.status) > -1; });
    var stale = waiting.filter(function (it) { return (daysSince(it.appliedDate) || 0) >= 21; }).length;

    var dot = syncState === "ok" ? "ok" : (syncState === "bad" ? "bad" : "");
    var label = syncState === "ok" ? "Synced" : (syncState === "bad" ? "Not synced" : "Local");

    var parts = ["<b>" + items.length + "</b> logged", "<b>" + waiting.length + "</b> awaiting a reply"];
    if (stale) parts.push('<span class="warn"><b>' + stale + "</b> past three weeks</span>");
    parts.push('<span><i class="sync-dot ' + dot + '"></i>' + label + "</span>");
    $tally.innerHTML = parts.join(", ");
  }

  function renderToolbar() {
    $toolbar.innerHTML =
      (canWrite()
        ? '<button class="btn-primary" id="pasteBtn">Paste a description</button>' +
          '<button class="btn-quiet" id="addBtn">Add manually</button>'
        : "") +
      '<input class="search" id="search" type="search" placeholder="Search company, role, or description" aria-label="Search entries" value="' + esc(query) + '">' +
      '<div class="filters" id="filters"></div>';

    $footer.innerHTML = canWrite()
      ? '<button class="btn-quiet" id="importBtn">Import</button>' +
        '<button class="btn-quiet" id="exportCsv">Export CSV</button>' +
        '<button class="btn-quiet" id="copyJson">Copy backup</button>'
      : '<button class="btn-quiet" id="unlockBtn">Unlock editing</button>';

    $banner.innerHTML = canWrite()
      ? ""
      : '<div class="viewonly"><span>View only. You can read everything here, but not change it.</span>' +
        '<button class="btn-quiet" id="unlockBtn2">Unlock editing</button></div>';
  }

  function renderFilters() {
    var el = document.getElementById("filters");
    if (!el) return;
    var counts = {};
    items.forEach(function (it) { counts[it.status] = (counts[it.status] || 0) + 1; });
    el.innerHTML = ["All"].concat(STATUSES).map(function (t) {
      var n = t === "All" ? items.length : (counts[t] || 0);
      if (t !== "All" && !n) return "";
      return '<button class="chip" data-filter="' + t + '" aria-pressed="' + (filter === t) + '">' + esc(t) + " " + n + "</button>";
    }).join("");
  }

  function renderRows() {
    var list = visible();

    if (!items.length) {
      $heads.hidden = true;
      $rows.innerHTML = '<div class="empty"><b>Nothing logged yet.</b>' +

                    (host(it.url) ? " on " + esc(host(it.url)) : "") + "</span>" : "") +

  /* ---------- reading a description ---------- */

  function readDescription() {
    var ta = document.getElementById("p-jd");
    var $btn = document.getElementById("readJd");
    var $hint = document.getElementById("pasteHint");
    var text = (ta.value || "").trim();

    if (text.length < 60) {
      $hint.className = "hint bad";
      $hint.textContent = "That looks too short. Paste the full posting.";
      return;
    }

    var keyField = document.getElementById("p-key");
    if (keyField && keyField.value.trim()) local(AKEY, keyField.value.trim());

    if (!apiKey()) {
      $hint.className = "hint bad";
      $hint.textContent = "Add a key above, or close this and use Add manually.";
      return;
    }

    $btn.disabled = true;
    $btn.textContent = "Reading";
    $hint.className = "hint";
    $hint.textContent = "Pulling the fields out.";

    var instruction =
      "Extract details from the job posting below. Reply with ONLY a JSON object.\n" +
      'Keys: "company", "role", "location", "postedDate", "digest".\n' +
      "company: the hiring organisation.\n" +
      "role: the job title, cleaned up. Include the team or division if stated.\n" +
      "location: city and country only.\n" +
      'postedDate: YYYY-MM-DD if a posting date appears, otherwise "".\n' +
      "digest: one sentence under 25 words on what the job involves day to day.\n" +
      'Use "" for anything the posting does not state. Do not guess.\n\nPOSTING:\n' + text;

    var ENDPOINT = "https://generativelanguage.googleapis.com/v1beta/models/";

    function body() {
      return JSON.stringify({
        contents: [{ parts: [{ text: instruction }] }],
        generationConfig: { responseMimeType: "application/json", temperature: 0 }
      });
    }

    function unwrap(r) {
      return r.json().then(function (data) {
        if (data.error) {
          var err = new Error(data.error.message || "request failed");
          err.status = data.error.status || r.status;
          throw err;
        }
        return data;
      });
    }

    // AQ. authentication keys have to travel in the x-goog-api-key header. The older
    // AIza traffic keys work either way, so the header is tried first and the legacy
    // query parameter is only used if the browser blocks the preflight.
    function callModel(model) {
      return fetch(ENDPOINT + model + ":generateContent", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-goog-api-key": apiKey()
        },
        body: body()
      })
        .then(unwrap)
        .catch(function (e) {
          if (!/Failed to fetch|NetworkError|CORS/i.test(String(e && e.message))) throw e;
          return fetch(ENDPOINT + model + ":generateContent?key=" + encodeURIComponent(apiKey()), {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: body()
          }).then(unwrap);
        });
    }

    var remembered = local(MKEY);
    var queue = remembered
      ? [remembered].concat(GEMINI_MODELS.filter(function (m) { return m !== remembered; }))
      : GEMINI_MODELS.slice();

    function attempt(i, lastErr) {
      if (i >= queue.length) return Promise.reject(lastErr || new Error("no model answered"));
      return callModel(queue[i])
        .then(function (data) { local(MKEY, queue[i]); return data; })
        .catch(function (e) {
          var missing = e.status === 404 || e.status === "NOT_FOUND" ||
                        /not found|not supported|does not exist/i.test(e.message || "");
          if (!missing) throw e;
          return attempt(i + 1, e);
        });
    }

    attempt(0)
      .then(function (data) {
        var raw = ((((data.candidates || [])[0] || {}).content || {}).parts || [])
          .map(function (p) { return p.text || ""; })
          .join("").replace(/```json|```/g, "").trim();

        var parsed = JSON.parse(raw.slice(raw.indexOf("{"), raw.lastIndexOf("}") + 1));

        var note = "";
        if (parsed.postedDate) note += "Posted " + parsed.postedDate + ". ";
        if (parsed.digest) note += parsed.digest;

        draftSeed = {
          company: parsed.company || "",
          role: parsed.role || "",
          location: parsed.location || "",
          source: "LinkedIn", url: "", status: "Saved", appliedDate: "",
          jd: text, notes: note.trim()
        };

        prefilled = true;
        pasting = false;
        editing = "new";
        render();
        toast("Fields read from the description.");
      })
      .catch(function (e) {
        $btn.disabled = false;
        $btn.textContent = "Read the description";
        $hint.className = "hint bad";

        var msg = String((e && e.message) || "");
        if (/API key not valid|API_KEY_INVALID|UNAUTHENTICATED|ACCESS_TOKEN_TYPE_UNSUPPORTED|api key/i.test(msg)) {
          $hint.textContent = "That key was rejected. Copy it again from AI Studio, or make a new one.";
          try { localStorage.removeItem(AKEY); } catch (ignore) {}
        } else if (/quota|RESOURCE_EXHAUSTED|rate/i.test(msg)) {
          $hint.textContent = "Rate limited by Google. Wait a minute and try again.";
        } else if (/not found|NOT_FOUND|not supported/i.test(msg)) {
          $hint.textContent = "No usable model on this key. Google may have retired the ones listed in the file.";
        } else if (/Failed to fetch|NetworkError/i.test(msg)) {
          $hint.textContent = "Could not reach Google. Check your connection.";
        } else {
          $hint.textContent = "Read failed: " + (msg.slice(0, 140) || "unknown error");
        }
      });
  }

  /* ---------- actions ---------- */

  function commit() {
    var v = function (id) { var el = document.getElementById("f-" + id); return el ? el.value.trim() : ""; };
    var company = v("company");
    if (!company) { toast("Add a company name to save this entry."); document.getElementById("f-company").focus(); return; }

    var data = {
      company: company,
      role: v("role"),
      location: v("location"),
      status: document.getElementById("f-status").value,
      appliedDate: v("appliedDate"),
      source: document.getElementById("f-source").value,
      route: document.getElementById("f-route").value,
      referrer: v("referrer"),
      resume: v("resume"),
      url: v("url"),
      jd: document.getElementById("f-jd").value.trim(),
      notes: v("notes")
    };

    if (data.status === "Saved") data.appliedDate = "";
    else if (!data.appliedDate) data.appliedDate = isoToday();

    if (editing === "new") {
      data.id = uid();
      data.createdAt = Date.now();
      items.unshift(data);
      toast("Entry saved.");
    } else {
      for (var i = 0; i < items.length; i++) {
        if (items[i].id === editing) {
          for (var k in data) items[i][k] = data[k];
          break;
        }
      }
      toast("Entry updated.");
    }

    editing = null;
    draftSeed = null;
    prefilled = false;
    save();
    render();
  }

  function runImport() {
    var $hint = document.getElementById("importHint");
    var incoming = safeParse((document.getElementById("i-json").value || "").trim());

    if (incoming === null) {
      $hint.className = "hint bad";
      $hint.textContent = "Could not read that. Check it starts with { and ends with }.";
      return;
    }
    if (incoming && !Array.isArray(incoming) && Array.isArray(incoming.entries)) incoming = incoming.entries;
    if (!Array.isArray(incoming)) {
      $hint.className = "hint bad";
      $hint.textContent = "Expected a list of entries.";
      return;
    }

    var have = {};
    items.forEach(function (it) {
      have[it.id] = true;
      have[(it.company || "") + "|" + (it.role || "")] = true;
    });

    var added = 0;
    incoming.forEach(function (it) {
      if (!it || typeof it !== "object" || !it.company) return;
      if (have[it.id] || have[(it.company || "") + "|" + (it.role || "")]) return;
      it.id = it.id || uid();
      it.createdAt = it.createdAt || Date.now();
      it.status = STATUSES.indexOf(it.status) > -1 ? it.status : "Saved";
      delete it.resumeUrl;
      delete it.resumes;
      items.push(it);
      have[it.id] = true;
      added++;
    });

    importing = false;
    tidy(items);
    save();
    render();
    toast(added ? "Imported " + added + (added === 1 ? " entry." : " entries.") : "Nothing new to import.");
  }

  function showCopyBox(payload) {
    $formHost.innerHTML = '<div class="form"><h2>Your backup</h2>' +
      '<div class="field wide"><textarea id="c-json" class="paste-jd"></textarea>' +
      '<span class="hint">Select all, copy, and paste it into a text file.</span></div>' +
      '<div class="form-actions"><button class="btn-quiet" id="cancelPanel">Close</button></div></div>';
    var t = document.getElementById("c-json");
    t.value = payload;
    t.focus();
    t.select();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function doCopy() {
    if (!items.length) { toast("Nothing to back up yet."); return; }
    var payload = JSON.stringify({ entries: items })
      .replace(/\u2028/g, "\\u2028")
      .replace(/\u2029/g, "\\u2029");
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(payload)
        .then(function () { toast("Copied."); })
        .catch(function () { showCopyBox(payload); });
    } else {
      showCopyBox(payload);
    }
  }

  function exportCsv() {
    if (!items.length) { toast("Nothing to export yet."); return; }
    var cols = ["company", "role", "location", "status", "appliedDate", "source", "route", "referrer", "resume", "url", "notes", "jd"];
    var q = function (s) { return '"' + String(s == null ? "" : s).replace(/"/g, '""') + '"'; };
    var rows = [cols.join(",")].concat(items.map(function (it) {
      return cols.map(function (c) { return q(it[c]); }).join(",");
    }));
    var blob = new Blob([rows.join("\r\n")], { type: "text/csv" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "applications.csv";
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }

  function closePanels() {
    editing = null; pasting = false; importing = false; unlocking = false;
    draftSeed = null; prefilled = false;
  }

  /* ---------- wiring ---------- */

  $toolbar.addEventListener("click", function (e) {
    var id = e.target.id;
    if (id === "pasteBtn") { closePanels(); pasting = true; openId = null; render(); }
    if (id === "addBtn") { closePanels(); editing = "new"; openId = null; render(); }

    var chip = e.target.closest("[data-filter]");
    if (chip) { filter = chip.dataset.filter; renderFilters(); renderRows(); }

    var id = e.target.id;
    if (id === "importBtn") { closePanels(); importing = true; render(); window.scrollTo({ top: 0, behavior: "smooth" }); }
    if (id === "exportCsv") exportCsv();
    if (id === "copyJson") doCopy();
    if (id === "unlockBtn") { closePanels(); unlocking = true; render(); window.scrollTo({ top: 0, behavior: "smooth" }); }
  });

  $banner.addEventListener("click", function (e) {
    if (e.target.id === "unlockBtn2") { closePanels(); unlocking = true; render(); window.scrollTo({ top: 0, behavior: "smooth" }); }
  });

  $formHost.addEventListener("click", function (e) {
    var id = e.target.id;
    if (id === "saveEntry") commit();
    if (id === "readJd") readDescription();
    if (id === "runImport") runImport();
    if (id === "cancelPanel") { closePanels(); render(); }

    if (id === "clearKey") {
      try { localStorage.removeItem(AKEY); } catch (ignore) {}
      var kept = document.getElementById("p-jd");
      var text = kept ? kept.value : "";
      renderPaste();
      var back = document.getElementById("p-jd");
      if (back) back.value = text;
      var box = document.getElementById("p-key");
      if (box) box.focus();
    }

    if (id === "doUnlock") {
      var pw = document.getElementById("u-pw").value.trim();
      var $h = document.getElementById("unlockHint");
      if (!pw) { $h.className = "hint bad"; $h.textContent = "Enter the password."; return; }

      $h.className = "hint";
      $h.textContent = "Checking.";

      // A write with the current list is the honest test: it either lands or is refused.
      fetch(SYNC_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ token: pw, entries: items })
      })
        .then(function (r) { return r.json(); })
        .then(function (data) {
          if (data.error) {
            $h.className = "hint bad";
            $h.textContent = "That password was not accepted.";
            return;
          }
          local(WKEY, pw);
          closePanels();
          syncState = "ok";
          render();
          toast("Editing unlocked on this device.");
        })
        .catch(function () {
          $h.className = "hint bad";
          $h.textContent = "Could not reach the sheet. Check your connection.";
        });
    }
  });

  $rows.addEventListener("click", function (e) {
    var open = e.target.closest("[data-open]");
    if (open) {
      openId = openId === open.dataset.open ? null : open.dataset.open;
      renderRows();
      return;
    }
    if (!canWrite()) return;

    var ed = e.target.closest("[data-edit]");
    if (ed) {
      closePanels();
      editing = ed.dataset.edit;
      openId = null;
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
      return;
    }
    var del = e.target.closest("[data-del]");
    if (del) {
      var it = items.filter(function (x) { return x.id === del.dataset.del; })[0];
      if (!it) return;
      if (!confirm("Delete the entry for " + (it.company || "this role") + "?")) return;
      items = items.filter(function (x) { return x.id !== del.dataset.del; });
      openId = null;
      save();
      render();
      toast("Entry deleted.");
    }
  });

  $rows.addEventListener("change", function (e) {
    if (!canWrite()) return;
    var sel = e.target.closest("[data-status]");
    if (!sel) return;
    var it = items.filter(function (x) { return x.id === sel.dataset.status; })[0];
    if (!it) return;
    it.status = sel.value;
    if (it.status === "Saved") it.appliedDate = "";
    else if (!it.appliedDate) it.appliedDate = isoToday();
    save();
    render();
    toast("Status set to " + it.status + ".");
  });

  /* ---------- keeping in step with the sheet ---------- */

  // A pull replaces everything on screen, so never run one while a panel is open
  // and half filled in. Those ticks are skipped and picked up on the next one.
  function busy() {
    return editing !== null || pasting || importing || unlocking;
  }

  function refresh() {
    if (!SYNC_URL || busy()) return;
    if (document.visibilityState === "hidden") return;
    if (dirty && canWrite()) { save(); return; }
    pullRemote(true);
  }

  setInterval(refresh, 120000);
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") refresh();
  });
  window.addEventListener("online", refresh);

  load();
})();
</script>
